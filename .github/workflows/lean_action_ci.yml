name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # Referee pushes its provenance ledger to the `referee-ledger` branch
  actions: read     # Referee reads the previous run's data for the revision diff
  pages: write      # deploy the site to GitHub Pages
  id-token: write   # required by actions/deploy-pages

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Builds the library with the Mathlib cache. This is the proof check: a failure here means
      # some file no longer compiles.
      - uses: leanprover/lean-action@v1

      # Referee (https://github.com/LeanMachineLearning/exposition) renders the compiled library
      # as a website: one page per declaration with its statement, proof and dependency graph,
      # plus the Theorems, Claims, Sorries and Trust pages. Pinned to the release built for this
      # project's Lean toolchain (see lean-toolchain); the two must match exactly.
      - name: Build the Referee site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: LeanMachineLearning/exposition@v4.34.0-rc2-7
        with:
          root: LeanP1
          site-url: https://mehrasaahmadip.github.io/Lean_InfoTheory
          repo-url: https://github.com/mehrasaahmadip/Lean_InfoTheory
          title: Lean_InfoTheory
          trust: mathlib
          site-dest: home_page

      - name: Upload the site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: home_page

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
