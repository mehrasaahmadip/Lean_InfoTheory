name = "Lean_P1"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LeanP1"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false # header linter is for Mathlib contributions, not user projects
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.0-rc2"

# Used by the blueprint's `checkdecls` step: verifies every `\lean{...}` name exists.
[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[lean_lib]]
name = "LeanP1"
